
name: Deploy Pharmadesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Extract Pharmadesk
        run: |
          unzip -o Pharmadesk-project-1.zip

      - name: Install dependencies
        working-directory: pharmadesk
        run: npm install

      - name: Build app
        working-directory: pharmadesk
        run: npm run build -- --base=/Pharmadesk/

      - name: Upload build
        uses: actions/upload-pages-artifact@v3
        with:
          path: pharmadesk/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        
